<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
  <title id="title">BIGにおけるClaude CodeとClaude Scienceの役割分担</title>
  <desc id="desc">研究者が問いと判断を担当し、Claude Codeが実装、Claude Scienceが計画・実行・成果物・由来を記録し、研究者が検証して次の実験へ戻す流れ。</desc>
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173b35" flood-opacity=".11"/></filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#71857f"/></marker>
    <style>
      .jp{font-family:"BIZ UDPGothic","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace;letter-spacing:.07em}
      .h{font-size:30px;font-weight:780;fill:#173b35}.k{font-size:14px;font-weight:800;fill:#5b706b}
      .lane{font-size:14px;font-weight:850}.title{font-size:23px;font-weight:780}.copy{font-size:15px;font-weight:540}
      .gate{font-size:17px;font-weight:800;fill:#173b35}.small{font-size:13px;font-weight:600;fill:#5a6d68}
    </style>
  </defs>
  <rect width="1200" height="770" rx="34" fill="#f4f7f3"/>
  <text x="64" y="66" class="jp h">AIは実行と記録を支え、研究判断は人間へ戻す</text>
  <text x="64" y="97" class="mono k">BIG RESEARCH LOOP / CODE → SCIENCE → HUMAN VERIFICATION</text>

  <g filter="url(#sh)">
    <rect x="64" y="136" width="1072" height="132" rx="22" fill="#173b35"/>
    <text x="94" y="174" class="mono lane" fill="#a9d6ce">HUMAN / BIG RESEARCHERS</text>
    <text x="94" y="211" class="jp title" fill="#fff">問い・experimental unit・assay・許可範囲を決める</text>
    <text x="94" y="240" class="jp copy" fill="#dcece8">Wet lab、材料・細胞の専門知、臨床文脈、安全・倫理、除外と解釈の責任を持つ。</text>
    <rect x="864" y="164" width="238" height="76" rx="15" fill="#244e47" stroke="#4f796f"/>
    <text x="983" y="194" text-anchor="middle" class="mono k" fill="#a9d6ce">INPUT CONTRACT</text>
    <text x="983" y="222" text-anchor="middle" class="jp small" fill="#fff">問い・単位・完了条件・reviewer</text>
  </g>

  <path d="M340 268 L340 318" stroke="#71857f" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M860 268 L860 318" stroke="#71857f" stroke-width="3" marker-end="url(#ar)"/>

  <g filter="url(#sh)">
    <rect x="64" y="319" width="500" height="189" rx="22" fill="#e8f2ef" stroke="#86b7ae"/>
    <text x="94" y="358" class="mono lane" fill="#0e6b63">CLAUDE CODE / IMPLEMENT</text>
    <text x="94" y="396" class="jp title" fill="#173b35">解析repoを作る</text>
    <text x="94" y="430" class="jp copy" fill="#4d625d">schema・loader・unit validation</text>
    <text x="94" y="457" class="jp copy" fill="#4d625d">metric・test・QC overlay・figure</text>
    <text x="94" y="484" class="jp copy" fill="#4d625d">README・method・failure condition</text>
  </g>

  <g filter="url(#sh)">
    <rect x="636" y="319" width="500" height="189" rx="22" fill="#eef2fb" stroke="#9cb4db"/>
    <text x="666" y="358" class="mono lane" fill="#557fbd">CLAUDE SCIENCE / RUN &amp; RECORD</text>
    <text x="666" y="396" class="jp title" fill="#173b35">実行と由来をつなぐ</text>
    <text x="666" y="430" class="jp copy" fill="#4d625d">plan・folder / network / compute permission</text>
    <text x="666" y="457" class="jp copy" fill="#4d625d">versioned artifact・code・environment</text>
    <text x="666" y="484" class="jp copy" fill="#4d625d">provenance・annotation・reviewer check</text>
  </g>

  <path d="M564 413 L636 413" stroke="#71857f" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M314 508 L314 563" stroke="#71857f" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M886 508 L886 563" stroke="#71857f" stroke-width="3" marker-end="url(#ar)"/>

  <g filter="url(#sh)">
    <rect x="175" y="564" width="850" height="104" rx="21" fill="#fff" stroke="#c8d4cf"/>
    <circle cx="224" cy="616" r="25" fill="#d9eab3"/>
    <path d="M211 616l9 9 17-20" fill="none" stroke="#45670d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="269" y="607" class="jp gate">HUMAN VERIFICATION GATE</text>
    <text x="269" y="638" class="jp copy" fill="#4d625d">原データ・手動reference・失敗例・科学的妥当性・共有範囲を研究者が確認する。</text>
  </g>

  <path d="M1025 616 C1122 616 1138 294 1068 268" fill="none" stroke="#71857f" stroke-width="3" marker-end="url(#ar)"/>
  <text x="1125" y="463" transform="rotate(-90 1125 463)" class="mono" font-size="11" font-weight="800" letter-spacing=".07em" fill="#5b706b">NEXT EXPERIMENT / APPROVED FEEDBACK</text>

  <rect x="64" y="716" width="1072" height="1" fill="#cbd7d2"/>
  <text x="600" y="748" text-anchor="middle" class="jp small">Reviewer agentは補助。再実行・生物学的妥当性・臨床安全性を保証しない。</text>
</svg>
